name: Release

# Push a version tag (e.g. v1.0.0) to build two exes and attach them to a
# GitHub Release:
#   AudioMixer.exe       - self-contained, standalone (no prerequisites)
#   AudioMixer-slim.exe  - framework-dependent (needs .NET 8 Desktop Runtime)
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish self-contained single-file exe
        run: >
          dotnet publish AudioMixer/AudioMixer.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -p:DebugSymbols=false
          -o publish

      - name: Publish slim framework-dependent exe
        run: >
          dotnet publish AudioMixer/AudioMixer.csproj
          -c Release
          -r win-x64
          --self-contained false
          -p:PublishSingleFile=true
          -p:DebugType=none
          -p:DebugSymbols=false
          -o publish-slim

      - name: Rename slim exe
        run: Rename-Item publish-slim/AudioMixer.exe AudioMixer-slim.exe
        shell: pwsh

      - name: Attach both exes to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/AudioMixer.exe
            publish-slim/AudioMixer-slim.exe
          generate_release_notes: true
